services:
  ailab-homepage:
    image: crpi-o9yt3hdv6ozp2o64.cn-heyuan.personal.cr.aliyuncs.com/dhu-ailab/ailab-homepage:latest
    build: .
    ports:
      # Only reachable from the server itself; visitors come in through Traefik.
      - 127.0.0.1:3001:3000
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: 3000
      ADMIN_ACCOUNT: AILAB
      # Real values live only on the server (/data/compose/ailab), never in this repository.
      ADMIN_PASSWORD: replace-with-a-long-random-password
      SESSION_SECRET: replace-with-output-of-openssl-rand-base64-32
      DATA_DIR: data
      COOKIE_SECURE: true
      TRUST_PROXY: true
